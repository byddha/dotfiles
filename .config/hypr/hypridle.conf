general {
    lock_cmd               = qs ipc call lock lock
    unlock_cmd             = qs ipc call lock unlock
    before_sleep_cmd       = brightnessctl -s && loginctl lock-session
    after_sleep_cmd        = brightnessctl -r
    ignore_dbus_inhibit    = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what = idle inhibitors
}

listener {
    timeout    = 180                            # in seconds
    # The shell cannot see DPMS, so it is told: video wallpapers stop decoding while the monitors are off
    on-timeout = qs ipc call wallpaper pause; hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; qs ipc call wallpaper resume
}
