# The lock runs from the bida-shell package (packages/bida-shell), the same copy as the greeter
general {
    lock_cmd               = /usr/share/bidshell/scripts/lock
    unlock_cmd             = /usr/share/bidshell/scripts/lock unlock
    before_sleep_cmd       = brightnessctl -s && loginctl lock-session
    after_sleep_cmd        = brightnessctl -r
    ignore_dbus_inhibit    = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what = idle inhibitors
    # Suspend waits until the lock screen is up (Hyprland's lock-notify), so the desktop never shows on resume
    inhibit_sleep          = 3
}

listener {
    timeout    = 180                            # in seconds
    # The shell and the lock cannot see DPMS, so they are told: video wallpapers stop decoding while the
    # monitors are off (scripts/lock also keeps it for a lock that starts while they are)
    on-timeout = qs ipc call wallpaper pause; /usr/share/bidshell/scripts/lock pause; hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; qs ipc call wallpaper resume; /usr/share/bidshell/scripts/lock resume
}

listener {
    timeout    = 300                            # in seconds
    # Locks after the monitors went off; the lock starts with its video paused (scripts/lock)
    on-timeout = loginctl lock-session
}
