# Steam Frame Wireless Adapter: transmit with the LPI (indoor) power limits
# instead of the VLP ones the headset's hotspot advertises. Off by default; see
# NOTES.md in the holo-realtek-firmware-toggles package. To try it without a
# reboot: echo 1 | sudo tee /sys/module/rtw89_core/parameters/steam_frame_lpi
# then reconnect the Frame.
#options rtw89_core steam_frame_lpi=1
