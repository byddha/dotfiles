# Kernel addresses help a local kernel exploit beat KASLR; hide them from unprivileged users
kernel.kptr_restrict = 1

# Unprivileged programs can no longer autoload old tty line discipline modules (n_gsm, n_hdlc)
# only to attack them; pppd and other root users still load what they need
dev.tty.ldisc_autoload = 0
